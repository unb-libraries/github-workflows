name: Notify Slack
description: >-
  Posts a run's start or conclusion to Slack. A step rather than a job, so the orchestrators
  can run it inside a job they already pay for: GitHub bills every job by the minute, rounded
  up, and a notification takes seconds.

inputs:
  webhook:
    description: 'Slack incoming webhook URL.'
    required: true
  conclusion:
    description: >-
      Empty (the default) announces the run's start. Otherwise the run's outcome: "success",
      "failure" or "cancelled". Anything else is reported as a warning.
    required: false
    default: ''
  fail-on-error:
    description: >-
      Fail the step when Slack rejects the message. Default false: a start notification must
      never block the build that runs after it. The conclusion sets true, so a broken payload
      or webhook is visible.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    -
      name: Build Slack payload
      id: payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        REF_NAME: ${{ github.ref_name }}
        WORKFLOW: ${{ github.workflow }}
        SHA: ${{ github.sha }}
        ACTOR: ${{ github.actor }}
        RUN_ID: ${{ github.run_id }}
        CONCLUSION: ${{ inputs.conclusion }}
      run: |
        COMMIT_JSON=$(gh api "repos/${REPO}/commits/${SHA}" 2>/dev/null || echo '{}')
        MESSAGE=$(jq -r '.commit.message // ""' <<<"$COMMIT_JSON")
        AUTHOR=$(jq -r '.commit.author.name // ""' <<<"$COMMIT_JSON")
        [ -z "$AUTHOR" ] && AUTHOR="$ACTOR"
        # Slack mrkdwn treats &, < and > as markup: an unescaped "<x>" in a commit message is
        # swallowed or becomes a mention, and a stray ">" can break the <url|text> links.
        slack_escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' <<<"$1"; }
        MESSAGE=$(slack_escape "$MESSAGE")
        AUTHOR=$(slack_escape "$AUTHOR")
        WORKFLOW=$(slack_escape "$WORKFLOW")
        REF_NAME=$(slack_escape "$REF_NAME")
        SHORT_SHA=${SHA:0:7}
        RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
        COMMIT_URL="${GITHUB_SERVER_URL}/${REPO}/commit/${SHA}"
        if [ -z "$CONCLUSION" ]; then
          COLOR="warning"
          STATUS="Build Started :deployparrot:"
        else
          case "$CONCLUSION" in
            success) COLOR="good";    EMOJI=":rocket:" ;;
            failure) COLOR="danger";  EMOJI=":boom:" ;;
            *)       COLOR="warning"; EMOJI=":boom:" ;;
          esac
          STATUS="$CONCLUSION $EMOJI"
        fi
        # Slack mrkdwn <url|text> links: workflow name -> this run, short SHA -> the commit.
        TEXT=$(printf '%s %s - %s (<%s|%s>)\n<%s|%s> %s\n%s' \
          "$REPO" "$REF_NAME" "$STATUS" "$RUN_URL" "$WORKFLOW" "$COMMIT_URL" "$SHORT_SHA" "$MESSAGE" "$AUTHOR")
        PAYLOAD=$(jq -cn --arg color "$COLOR" --arg text "$TEXT" \
          '{attachments: [{color: $color, text: $text, mrkdwn_in: ["text"]}]}')
        echo "json=$PAYLOAD" >> "$GITHUB_OUTPUT"
    -
      uses: slackapi/slack-github-action@v3
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        errors: ${{ inputs.fail-on-error }}
        payload: ${{ steps.payload.outputs.json }}
