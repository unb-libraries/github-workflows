name: Send Notifications Announcing Workflow Start

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

# The message itself is .github/actions/notify-slack, which the orchestrators run as a step.
jobs:
  slack-start:
    name: Notify of Start
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: unb-libraries/github-workflows/.github/actions/notify-slack@1.x
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          fail-on-error: false   # best-effort: must never block builds that gate on this job
