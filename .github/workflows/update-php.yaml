name: Update PHP Application and Dependencies

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version composer resolves dependencies against. Match the version the application runs.'
        required: false
        type: string
        default: '8.4'
      dir:
        description: 'Directory holding composer.json and composer.lock, relative to the repository root. Default the root.'
        required: false
        type: string
        default: '.'
      pr-branch:
        description: 'Branch the pull request is opened from. Default application-updates.'
        required: false
        type: string
        default: 'application-updates'
      git-author:
        description: 'Author identity ("Name <email>") for the update PR commit.'
        required: false
        type: string
        default: 'UNB Libraries CodeBot <libsystems@unb.ca>'
      git-committer:
        description: 'Committer identity ("Name <email>") for the update PR commit.'
        required: false
        type: string
        default: 'UNB Libraries CodeBot <libsystems@unb.ca>'
    secrets:
      PAT_TOKEN:
        description: 'The token to use for creating the pull request'
        required: true

jobs:
  update-application:
    name: Update Application and Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer
          coverage: none

      - name: Update Application and Dependencies
        working-directory: ${{ inputs.dir }}
        env:
          PHP_VERSION: ${{ inputs.php-version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Authenticated GitHub downloads avoid the anonymous API rate limit.
          COMPOSER_AUTH=$(jq -cn --arg token "$GITHUB_TOKEN" '{"github-oauth": {"github.com": $token}}')
          export COMPOSER_AUTH
          # The same resolution as update.yaml: the PHP version is checked strictly, extension
          # requirements are not, since the runner's extensions aren't the application's.
          composer update --no-install --no-scripts --no-plugins --no-interaction --ignore-platform-req=ext-*

          # Direct dependencies that changed, then a count of changed transitive packages.
          # Through a file: a lock file can exceed the 128 KB limit on a single argument.
          git show HEAD:./composer.lock > "$RUNNER_TEMP/old.lock" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/old.lock"
          {
            printf 'Auto-generated by [github-workflows][1] with PHP %s.\n\n' "$(php -r 'echo PHP_VERSION;')"
            jq -rn \
              --slurpfile oldlock "$RUNNER_TEMP/old.lock" \
              --slurpfile new composer.lock \
              --slurpfile manifest composer.json '
              # A branch alias (dev-*) keeps its version as its commit moves, so show the commit.
              def versions(lock): ((lock.packages // []) + (lock["packages-dev"] // []))
                | map({key: .name, value: (if (.version | startswith("dev-"))
                    then "\(.version) \((.source.reference // .dist.reference // "")[0:7])"
                    else .version end)}) | from_entries;
              versions($oldlock[0]) as $o | versions($new[0]) as $n
              | ($manifest[0] | ((.require // {}) + (."require-dev" // {})) | keys) as $direct
              | [($o + $n) | keys[] | select($o[.] != $n[.])] as $changed
              | [$changed[] | select(. as $p | $direct | index($p))] as $rows
              | (if ($rows | length) > 0
                  then "| Package | From | To |\n|---|---|---|\n"
                    + ($rows | map("| \(.) | \($o[.] // "-") | \($n[.] // "-") |") | join("\n"))
                  else "No direct dependency changes." end)
                + "\n\nTransitive packages changed: \(($changed | length) - ($rows | length))"'
            printf '\n[1]: https://github.com/unb-libraries/github-workflows/blob/1.x/.github/workflows/update-php.yaml\n'
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: Update Application and Dependencies
          committer: ${{ inputs.git-committer }}
          author: ${{ inputs.git-author }}
          signoff: false
          branch: ${{ inputs.pr-branch }}
          add-paths: |
            ${{ inputs.dir }}/composer.json
            ${{ inputs.dir }}/composer.lock
          delete-branch: true
          title: 'Application Updates'
          body-path: ${{ runner.temp }}/body.md
          labels: |
            automated
            updates
          draft: false
