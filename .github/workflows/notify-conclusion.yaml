name: Send Notifications Announcing Workflow Conclusion

on:
  workflow_call:
    inputs:
      conclusion:
        description: >-
          The run's outcome, computed by the calling workflow from its jobs' results:
          "success", "failure" or "cancelled". Anything else is reported as a warning.
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

# The message itself is .github/actions/notify-slack, which the orchestrators run as a step.
jobs:
  slack-results:
    name: Notify of Conclusion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: unb-libraries/github-workflows/.github/actions/notify-slack@1.x
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          conclusion: ${{ inputs.conclusion }}
          fail-on-error: true    # terminal job: fail loudly so broken payloads/webhook are visible
