name: Send Notifications Announcing Workflow Conclusion

on:
  workflow_call:
    inputs:
      conclusion:
        description: >-
          The run's outcome, computed by the calling workflow from its jobs' results:
          "success", "failure" or "cancelled". Anything else is reported as a warning.
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  slack-results:
    name: Notify of Conclusion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Build Slack payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          CONCLUSION: ${{ inputs.conclusion }}
        run: |
          COMMIT_JSON=$(gh api "repos/${REPO}/commits/${SHA}" 2>/dev/null || echo '{}')
          MESSAGE=$(jq -r '.commit.message // ""' <<<"$COMMIT_JSON")
          AUTHOR=$(jq -r '.commit.author.name // ""' <<<"$COMMIT_JSON")
          [ -z "$AUTHOR" ] && AUTHOR="$ACTOR"
          # Slack mrkdwn treats &, < and > as markup: an unescaped "<x>" in a commit message is
          # swallowed or becomes a mention, and a stray ">" can break the <url|text> links.
          slack_escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' <<<"$1"; }
          MESSAGE=$(slack_escape "$MESSAGE")
          AUTHOR=$(slack_escape "$AUTHOR")
          WORKFLOW=$(slack_escape "$WORKFLOW")
          REF_NAME=$(slack_escape "$REF_NAME")
          SHORT_SHA=${SHA:0:7}
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${REPO}/commit/${SHA}"
          case "$CONCLUSION" in
            success) COLOR="good";    EMOJI=":rocket:" ;;
            failure) COLOR="danger";  EMOJI=":boom:" ;;
            *)       COLOR="warning"; EMOJI=":boom:" ;;
          esac
          # Slack mrkdwn <url|text> links: workflow name -> this run, short SHA -> the commit.
          TEXT=$(printf '%s %s - %s %s (<%s|%s>)\n<%s|%s> %s\n%s' \
            "$REPO" "$REF_NAME" "$CONCLUSION" "$EMOJI" "$RUN_URL" "$WORKFLOW" "$COMMIT_URL" "$SHORT_SHA" "$MESSAGE" "$AUTHOR")
          PAYLOAD=$(jq -cn --arg color "$COLOR" --arg text "$TEXT" \
            '{attachments: [{color: $color, text: $text, mrkdwn_in: ["text"]}]}')
          echo "json=$PAYLOAD" >> "$GITHUB_OUTPUT"
      - uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true           # terminal job: fail loudly so broken payloads/webhook are visible
          payload: ${{ steps.payload.outputs.json }}
