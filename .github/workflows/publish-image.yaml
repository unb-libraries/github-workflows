name: Publish Image

on:
  workflow_call:
    inputs:
      image-name:
        description: 'The full, repository namespaced image name to build (without the tag).'
        required: true
        type: string
      pre-build-command:
        description: 'Optional shell command run once in the repository root before the image build. Requires pre-build-outputs. See build-push.yaml.'
        required: false
        type: string
        default: ''
      pre-build-outputs:
        description: 'Newline-separated repository-relative paths or globs that pre-build-command produces; only these reach the image. See build-push.yaml.'
        required: false
        type: string
        default: ''
      platforms:
        description: "A comma-separated list of platforms."
        required: false
        type: string
        default: linux/amd64,linux/arm64/v8
      build-cache:
        description: 'Read and write a BuildKit layer cache stored as <image-name>:buildcache-<platform> in the registry. Default true.'
        required: false
        type: boolean
        default: true
      docker-build-record-retention-days:
        description: 'Number of days to retain Docker build records.'
        required: false
        type: number
        default: 3
      checkout-fetch-depth:
        description: 'fetch-depth for the build-push source checkout. Default 1 (shallow).'
        required: false
        type: number
        default: 1
      dockerfile:
        description: 'Path to the Dockerfile, relative to the repository root. Default empty.'
        required: false
        type: string
        default: ''
      build-context:
        description: 'The Docker build context, relative to the repository root. Default ".".'
        required: false
        type: string
        default: '.'
      distribute:
        description: 'Build each platform in its own job on a native runner, then merge them. Set false to build every platform in one job under emulation. See build-push.yaml.'
        required: false
        type: boolean
        default: true
      arm64-runner:
        description: 'Runner label for linux/arm64 builds when distribute is true.'
        required: false
        type: string
        default: ubuntu-24.04-arm
      amd64-runner:
        description: 'Runner label for linux/amd64 builds and emulated platforms.'
        required: false
        type: string
        default: ubuntu-latest
      compression:
        description: 'Layer compression: "zstd" (default) or "gzip". zstd requires containerd 1.5+ / Docker 23+ wherever the image is pulled.'
        required: false
        type: string
        default: zstd
    outputs:
      image-tag:
        description: 'The immutable <short-sha>-<timestamp> tag that was pushed.'
        value: ${{ jobs.build-push-images.outputs.image-tag }}
      image-full-name:
        description: 'The full <image-name>:<tag> reference that was pushed.'
        value: ${{ jobs.build-push-images.outputs.image-full-name }}
    secrets:
      SLACK_WEBHOOK_URL:
        required: true
      GH_CONTAINER_REGISTRY_USER:
        required: true
      GH_CONTAINER_REGISTRY_TOKEN:
        required: true
      GH_NPM_TOKEN:
        description: 'Optional token for the GitHub npm registry, exposed to the image build as the npmrc build secret.'
        required: false

jobs:
  notify-start:
    name: Notify of Start
    if: always()
    uses: unb-libraries/github-workflows/.github/workflows/notify-start.yaml@harden
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  build-push-images:
    uses: unb-libraries/github-workflows/.github/workflows/build-push.yaml@harden
    needs: [ notify-start ]
    with:
      image-name: ${{ inputs.image-name }}
      pre-build-command: ${{ inputs.pre-build-command }}
      pre-build-outputs: ${{ inputs.pre-build-outputs }}
      platforms: ${{ inputs.platforms }}
      build-cache: ${{ inputs.build-cache }}
      docker-build-record-retention-days: ${{ inputs.docker-build-record-retention-days }}
      checkout-fetch-depth: ${{ inputs.checkout-fetch-depth }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      distribute: ${{ inputs.distribute }}
      arm64-runner: ${{ inputs.arm64-runner }}
      amd64-runner: ${{ inputs.amd64-runner }}
      compression: ${{ inputs.compression }}
    secrets:
      GH_CONTAINER_REGISTRY_USER: ${{ secrets.GH_CONTAINER_REGISTRY_USER }}
      GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
      GH_NPM_TOKEN: ${{ secrets.GH_NPM_TOKEN }}

  notify-conclusion:
    name: Notify of Conclusion
    uses: unb-libraries/github-workflows/.github/workflows/notify-conclusion.yaml@harden
    needs: [ build-push-images ]
    if: always()
    with:
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
