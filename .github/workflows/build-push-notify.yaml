name: Build Image and Push To Registry, with Notifications (deprecated)

# DEPRECATED (remove in 2.x): use publish-image.yaml, which this now wraps unchanged.

on:
  workflow_call:
    inputs:
      image-name:
        description: 'The full, repository namespaced image name to build (without the tag).'
        required: true
        type: string
      pre-build-command:
        description: 'Optional shell command run in the repository root before the image build. See build-push.yaml.'
        required: false
        type: string
        default: ''
      platforms:
        description: "A comma-separated list of platforms."
        required: false
        type: string
        default: linux/amd64,linux/arm64/v8
      build-cache:
        description: 'Read and write a BuildKit layer cache in the calling repository''s Actions cache. Default true.'
        required: false
        type: boolean
        default: true
      docker-build-record-retention-days:
        description: 'Number of days to retain Docker build records.'
        required: false
        type: number
        default: 3
      checkout-fetch-depth:
        description: 'fetch-depth for the build-push source checkout. Default 1 (shallow).'
        required: false
        type: number
        default: 1
      dockerfile:
        description: 'Path to the Dockerfile, relative to the repository root. Default empty.'
        required: false
        type: string
        default: ''
      build-context:
        description: 'The Docker build context, relative to the repository root. Default ".".'
        required: false
        type: string
        default: '.'
      distribute:
        description: 'Build each platform in its own job on a native runner, then merge them. Set false to build every platform in one job under emulation. See build-push.yaml.'
        required: false
        type: boolean
        default: true
      arm64-runner:
        description: 'Runner label for linux/arm64 builds when distribute is true.'
        required: false
        type: string
        default: ubuntu-24.04-arm
      amd64-runner:
        description: 'Runner label for linux/amd64 builds and emulated platforms.'
        required: false
        type: string
        default: ubuntu-latest
      compression:
        description: 'Layer compression: "zstd" (default) or "gzip". zstd requires containerd 1.5+ / Docker 23+ wherever the image is pulled.'
        required: false
        type: string
        default: zstd
    outputs:
      image-tag:
        description: 'The immutable <short-sha>-<timestamp> tag that was pushed.'
        value: ${{ jobs.publish.outputs.image-tag }}
      image-full-name:
        description: 'The full <image-name>:<tag> reference that was pushed.'
        value: ${{ jobs.publish.outputs.image-full-name }}
    secrets:
      SLACK_WEBHOOK_URL:
        required: true
      GH_CONTAINER_REGISTRY_USER:
        required: true
      GH_CONTAINER_REGISTRY_TOKEN:
        required: true


jobs:
  publish:
    uses: unb-libraries/github-workflows/.github/workflows/publish-image.yaml@1.x
    with:
      image-name: ${{ inputs.image-name }}
      pre-build-command: ${{ inputs.pre-build-command }}
      platforms: ${{ inputs.platforms }}
      build-cache: ${{ inputs.build-cache }}
      docker-build-record-retention-days: ${{ inputs.docker-build-record-retention-days }}
      checkout-fetch-depth: ${{ inputs.checkout-fetch-depth }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      distribute: ${{ inputs.distribute }}
      arm64-runner: ${{ inputs.arm64-runner }}
      amd64-runner: ${{ inputs.amd64-runner }}
      compression: ${{ inputs.compression }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GH_CONTAINER_REGISTRY_USER: ${{ secrets.GH_CONTAINER_REGISTRY_USER }}
      GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
