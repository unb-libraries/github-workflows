name: Update Nuxt Application and Dependencies

on:
  workflow_call:
    inputs:
      latest:
        description: 'Update to the latest versions, ignoring the ranges in package.json (pnpm update --latest). Defaults to staying within the declared ranges.'
        required: false
        type: boolean
        default: false
      node-version:
        description: 'Node.js version used to run pnpm.'
        required: false
        type: string
        default: '24'
      pr-branch:
        description: 'Branch the pull request is opened from. Default application-updates.'
        required: false
        type: string
        default: 'application-updates'
      git-author:
        description: 'Author identity ("Name <email>") for the update PR commit.'
        required: false
        type: string
        default: 'UNB Libraries CodeBot <libsystems@unb.ca>'
      git-committer:
        description: 'Committer identity ("Name <email>") for the update PR commit.'
        required: false
        type: string
        default: 'UNB Libraries CodeBot <libsystems@unb.ca>'
    secrets:
      PAT_TOKEN:
        description: 'The token to use for creating the pull request'
        required: true

jobs:
  # The update itself lives in update-node.yaml; this file keeps the Nuxt sites' callers working.
  update:
    uses: ./.github/workflows/update-node.yaml
    with:
      latest: ${{ inputs.latest }}
      node-version: ${{ inputs.node-version }}
      pr-branch: ${{ inputs.pr-branch }}
      git-author: ${{ inputs.git-author }}
      git-committer: ${{ inputs.git-committer }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
