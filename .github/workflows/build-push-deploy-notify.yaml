name: Build Image and Push, then Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      branch-env-map:
        description: 'A mapping of branches-to-k8s-namespaces. JSON dictionary format.'
        required: true
        type: string
      deploy-branches:
        description: 'A list of branches that should be deployed to kubernetes cluster. JSON list format.'
        required: true
        type: string
      image-name:
        description: 'The full, repository namespaced image name to build (without the tag).'
        required: true
        type: string
      k8s-deployment-name:
        description: 'The name(s) of the kubernetes deployment(s) to update. Supports CSV for multiple deployments (e.g., "deploy1,deploy2"). Each name must equal its pod container name.'
        required: true
        type: string
      pre-build-command:
        description: 'Optional shell command run in the repository root before the image build. See build-push.yaml.'
        required: false
        type: string
        default: ''
      platforms:
        description: "A comma-separated list of platforms."
        required: false
        type: string
        default: linux/amd64,linux/arm64/v8
      build-cache:
        description: 'Read and write a BuildKit layer cache in the calling repository''s Actions cache. Default true.'
        required: false
        type: boolean
        default: true
      docker-build-record-retention-days:
        description: 'Number of days to retain Docker build records.'
        required: false
        type: number
        default: 3
      checkout-fetch-depth:
        description: 'fetch-depth for the build-push source checkout. Default 1 (shallow). Set 0 for full history when the build needs it (e.g. git-based last-updated dates).'
        required: false
        type: number
        default: 1
      collect-logs:
        description: 'Collect post-rollout container logs and upload them as the deployment-logs artifact. Default false.'
        required: false
        type: boolean
        default: false
      check-logs:
        description: 'Fail the run if the post-rollout container logs contain error lines. Implies collect-logs. Default false.'
        required: false
        type: boolean
        default: false
      log-check-profile:
        description: 'Exception set for check-logs: "generic" (none) or "drupal". Default generic.'
        required: false
        type: string
        default: generic
      log-check-exceptions:
        description: 'Additional newline-delimited exception patterns for check-logs (case-insensitive regular expressions). A line matching one is not an error.'
        required: false
        type: string
        default: ''
      rollout-timeout:
        description: 'Timeout passed to `kubectl rollout status`. Default 10m.'
        required: false
        type: string
        default: '10m'
      dockerfile:
        description: 'Path to the Dockerfile, relative to the repository root. Default empty, which lets buildx use "<build-context>/Dockerfile".'
        required: false
        type: string
        default: ''
      build-context:
        description: 'The Docker build context, relative to the repository root. Default ".". Note that .dockerignore is read from inside the context directory, so a root .dockerignore does not apply to a subdirectory context.'
        required: false
        type: string
        default: '.'
      distribute:
        description: 'Build each platform in its own job on a native runner, then merge them. Set false to build every platform in one job under emulation. See build-push.yaml.'
        required: false
        type: boolean
        default: true
      arm64-runner:
        description: 'Runner label for linux/arm64 builds when distribute is true.'
        required: false
        type: string
        default: ubuntu-24.04-arm
      amd64-runner:
        description: 'Runner label for linux/amd64 builds and emulated platforms.'
        required: false
        type: string
        default: ubuntu-latest
      compression:
        description: 'Layer compression: "zstd" (default) or "gzip". zstd requires containerd 1.5+ / Docker 23+ wherever the image is pulled.'
        required: false
        type: string
        default: zstd
    secrets:
      KUBE_CONFIG:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      GH_CONTAINER_REGISTRY_USER:
        required: true
      GH_CONTAINER_REGISTRY_TOKEN:
        required: true

jobs:
  notify-start:
    name: Notify Start
    if: always()
    uses: unb-libraries/github-workflows/.github/workflows/notify-start.yaml@1.x
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  build-push-images:
    name: Build/Push Images
    uses: unb-libraries/github-workflows/.github/workflows/build-push.yaml@1.x
    with:
      image-name: ${{ inputs.image-name }}
      pre-build-command: ${{ inputs.pre-build-command }}
      platforms: ${{ inputs.platforms }}
      build-cache: ${{ inputs.build-cache }}
      docker-build-record-retention-days: ${{ inputs.docker-build-record-retention-days }}
      checkout-fetch-depth: ${{ inputs.checkout-fetch-depth }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      distribute: ${{ inputs.distribute }}
      arm64-runner: ${{ inputs.arm64-runner }}
      amd64-runner: ${{ inputs.amd64-runner }}
      compression: ${{ inputs.compression }}
    secrets:
      GH_CONTAINER_REGISTRY_USER: ${{ secrets.GH_CONTAINER_REGISTRY_USER }}
      GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}

  deploy-image-to-k8s:
    name: Deploy New Image
    uses: unb-libraries/github-workflows/.github/workflows/deploy.yaml@1.x
    needs: [ build-push-images ]
    with:
      branch-env-map: ${{ inputs.branch-env-map }}
      deploy-branches: ${{ inputs.deploy-branches }}
      k8s-deployment-name: ${{ inputs.k8s-deployment-name }}
      image-full-name: ${{ needs.build-push-images.outputs.image-full-name }}
      collect-logs: ${{ inputs.collect-logs || inputs.check-logs }}
      rollout-timeout: ${{ inputs.rollout-timeout }}
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

  check-deployment-logs:
    name: Check New Deployment Logs
    needs: [ deploy-image-to-k8s ]
    # Skipped along with the deploy on non-deploy branches.
    if: ${{ inputs.check-logs }}
    runs-on: ubuntu-latest
    steps:
      -
        name: Retrieve The Log Artifact
        uses: actions/download-artifact@v8
        with:
          name: deployment-logs
          path: /tmp/logs
      -
        uses: unb-libraries/github-workflows/.github/actions/check-logs@1.x
        with:
          log-file: /tmp/logs/deployment_logs.txt
          profile: ${{ inputs.log-check-profile }}
          extra-exceptions: ${{ inputs.log-check-exceptions }}
      -
        name: Display Full Logs
        # Without always() this is skipped exactly when the check fails, which is the only
        # time the logs are needed. The fallback keeps a missing artifact from adding a
        # second, misleading failure.
        if: always()
        run: cat /tmp/logs/deployment_logs.txt || echo "No log file at /tmp/logs/deployment_logs.txt"
        shell: bash

  prune-old-images:
    name: Prune Old Images
    needs: [ deploy-image-to-k8s ]
    if: ${{ success() && contains(fromJSON(inputs.deploy-branches), github.ref_name) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: prune-${{ inputs.image-name }}
      cancel-in-progress: false
    steps:
      - uses: unb-libraries/container-image-pruner@v1
        with:
          image-name: ${{ inputs.image-name }}
          token: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
          max-delete: 1500

  notify-conclusion:
    name: Notify Conclusion
    uses: unb-libraries/github-workflows/.github/workflows/notify-conclusion.yaml@1.x
    needs: [ deploy-image-to-k8s, check-deployment-logs ]
    if: always()
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
